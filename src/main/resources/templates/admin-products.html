<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Product Management</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="admin-container">
        <h1>Admin Product Management</h1>

        <p th:if="${message}" th:text="${message}" role="status" class="form-status success"></p>
        <a th:href="@{/admin/products/add}" class="admin-button add-button">Add Product</a>

        <div class="admin-product-list">
            <article th:each="product : ${products}" class="admin-product-card">
                <div class="product-image">
                    <img th:src="@{${product.imageUrl}}" th:alt="${product.name + ' product image'}" class="product-img" />
                </div>

                <div class="product-details">
                    <h2 th:id="${'product-title-' + product.productId}" th:text="${product.name}">Product name</h2>
                    <p th:text="${product.description}">Description</p>
                    <p class="price">$<span th:text="${product.price}">0.00</span></p>
                    <p class="stock">Stock: <span th:text="${product.stockQuantity}">0</span></p>
                </div>

                <div class="admin-actions">
                    <button type="button"
                            class="admin-button edit-button"
                            th:attr="aria-controls=${'edit-product-' + product.productId},aria-label=${'Edit ' + product.name}"
                            aria-expanded="false">Edit</button>

                    <form th:action="@{/admin/products/delete/{id}(id=${product.productId})}" method="post" class="delete-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="admin-button delete-button" th:attr="aria-label=${'Delete ' + product.name}">Delete</button>
                    </form>
                </div>

                <section class="edit-product-form-container"
                         th:id="${'edit-product-' + product.productId}"
                         th:attr="hidden=${editingProductId == product.productId ? null : 'hidden'},aria-labelledby=${'edit-title-' + product.productId}">
                    <form th:action="@{/admin/products/edit/{id}(id=${product.productId})}" th:object="${productForm}" method="post" class="edit-product-form product-form" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" th:id="${'imageUrl-' + product.productId}" name="imageUrl" th:value="${editingProductId == product.productId and productForm != null ? productForm.imageUrl : product.imageUrl}" />

                        <h3 th:id="${'edit-title-' + product.productId}" th:text="${'Edit ' + product.name}">Edit Product</h3>
                        <p th:id="${'edit-status-' + product.productId}" role="status" aria-live="polite" class="form-status"></p>
                        <div th:if="${editingProductId == product.productId and #fields.hasAnyErrors()}" role="alert" class="field-error">
                            <p>Please correct the highlighted fields.</p>
                        </div>

                        <label th:for="${'name-' + product.productId}">Name</label>
                        <input type="text" name="name" th:id="${'name-' + product.productId}" th:value="${editingProductId == product.productId and productForm != null ? productForm.name : product.name}" required maxlength="120" autocomplete="off" th:attr="aria-describedby=${'name-error-' + product.productId}">
                        <span class="field-error" th:id="${'name-error-' + product.productId}" th:if="${editingProductId == product.productId}" th:errors="*{name}"></span>

                        <label th:for="${'description-' + product.productId}">Description</label>
                        <textarea name="description" th:id="${'description-' + product.productId}" required maxlength="1000" autocomplete="off" th:attr="aria-describedby=${'description-error-' + product.productId}" th:text="${editingProductId == product.productId and productForm != null ? productForm.description : product.description}"></textarea>
                        <span class="field-error" th:id="${'description-error-' + product.productId}" th:if="${editingProductId == product.productId}" th:errors="*{description}"></span>

                        <label th:for="${'price-' + product.productId}">Price</label>
                        <input type="number" step="0.01" min="0.01" name="price" th:id="${'price-' + product.productId}" th:value="${editingProductId == product.productId and productForm != null ? productForm.price : product.price}" inputmode="decimal" required th:attr="aria-describedby=${'price-error-' + product.productId}">
                        <span class="field-error" th:id="${'price-error-' + product.productId}" th:if="${editingProductId == product.productId}" th:errors="*{price}"></span>

                        <label th:for="${'stockQuantity-' + product.productId}">Stock Quantity</label>
                        <input type="number" min="0" name="stockQuantity" th:id="${'stockQuantity-' + product.productId}" th:value="${editingProductId == product.productId and productForm != null ? productForm.stockQuantity : product.stockQuantity}" inputmode="numeric" required th:attr="aria-describedby=${'stock-error-' + product.productId}">
                        <span class="field-error" th:id="${'stock-error-' + product.productId}" th:if="${editingProductId == product.productId}" th:errors="*{stockQuantity}"></span>

                        <label th:for="${'image-' + product.productId}">Replace Product Image</label>
                        <input class="product-image-input" type="file" name="image" th:id="${'image-' + product.productId}" accept="image/jpeg,image/png">

                        <button type="submit" class="admin-button edit-button">Save Changes</button>
                    </form>
                </section>
            </article>
        </div>
    </main>

    <script src="/js/add-product.js"></script>
</body>
</html>
