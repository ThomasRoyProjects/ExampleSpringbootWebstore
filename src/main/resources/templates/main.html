<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <a class="logo-container" th:href="@{/}" aria-label="Skincare store home">
        <img class="logo" th:src="@{/images/skincarelogo.png}" alt="Skincare store logo">
    </a>
</header>
<nav class="nav-bar" aria-label="Account">
    <a th:href="@{/login}" class="btn">Sign In</a>
    <a th:href="@{/register}" class="btn">Sign Up</a>
</nav>
<main>
    <h1 class="title-pages">Our Products</h1>

    <div class="product-grid">
        <article th:each="product : ${products}" class="product-card">
            <div class="product-image">
                <img th:src="@{${product.imageUrl}}" th:alt="${product.name + ' product image'}" />
            </div>
            <div class="product-info">
                <h2 th:text="${product.name}">Product Name</h2>
                <p th:text="${product.description}">Product Description</p>
                <p class="price">
                    Price: <span th:text="' $' + ${product.price}">$0.00</span>
                </p>
                <p class="stock">
                    Stock: <span th:text="${product.stockQuantity > 0 ? product.stockQuantity : 'Out of Stock'}">Out of Stock</span>
                </p>
                <a th:if="${product.stockQuantity > 0}" th:href="@{/login}" class="btn">Sign in to Add to Cart</a>
                <button th:unless="${product.stockQuantity > 0}" class="add-to-cart" type="button" disabled th:attr="aria-label=${product.name + ' is out of stock'}">Out of Stock</button>
            </div>
        </article>
    </div>
</main>
</body>
</html>
