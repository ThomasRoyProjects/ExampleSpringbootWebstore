<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<main class="login-container">
  <div class="login-form">
    <h1>Login</h1>
    <p class="auth-support">Sign in with the email address attached to your account.</p>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required aria-describedby="login-error">
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <p id="login-error" class="field-error" th:if="${param.error}" role="alert">We couldn't sign you in with that email and password.</p>
      <button class="auth-primary" type="submit">Login</button>
    </form>
    <p class="auth-secondary"><a class="btn" href="/register">Register</a></p>
  </div>
</main>
</body>
</html>
