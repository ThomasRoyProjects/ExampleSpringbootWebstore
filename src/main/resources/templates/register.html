<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
<main class="login-container">
    <div class="login-form">
        <h1>Register</h1>
        <p class="auth-support">Create your account with an email address and secure password.</p>
        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" maxlength="254" autocomplete="email" inputmode="email" required aria-describedby="email-error">
                <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" minlength="8" maxlength="72" autocomplete="new-password" required aria-describedby="password-error">
                <p id="password-error" class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button class="auth-primary" type="submit">Register</button>
        </form>
        <p th:if="${error}" class="field-error" th:text="${error}" role="alert"></p>
        <p class="auth-secondary"><a class="btn" href="/login">Already have an account? Login here</a></p>
    </div>
</main>
</body>
</html>
