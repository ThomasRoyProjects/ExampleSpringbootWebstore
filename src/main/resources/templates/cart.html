<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body>
<main class="cart-page">
    <h1>Your Cart</h1>
    <p class="cart-note">The products drawer is the canonical cart experience. This page shows the same cart contents for direct links.</p>
    <div id="cartStatus" class="cart-status" role="status" aria-live="polite"></div>

    <section id="cartItems" class="cart-items" th:fragment="cart-items" aria-live="polite">
        <p class="empty-cart" th:if="${cartItems == null or #lists.isEmpty(cartItems)}">Your cart is empty.</p>

        <table class="cart-items-table" th:if="${cartItems != null and !#lists.isEmpty(cartItems)}">
            <caption class="sr-only">Products currently in your cart</caption>
            <thead>
                <tr>
                    <th scope="col">Image</th>
                    <th scope="col">Product</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Line total</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td><img th:src="@{${item.imageUrl}}" th:alt="${item.productName + ' product image'}" width="64" height="64"></td>
                    <th scope="row" th:text="${item.productName}">Product Name</th>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="'$' + ${item.lineTotal}">$0.00</td>
                    <td><button class="remove-item" type="button" th:attr="data-id=${item.productId},aria-label=${'Remove ' + item.productName + ' from cart'}">Remove</button></td>
                </tr>
            </tbody>
        </table>
        <div id="cartTotal" class="cart-total" th:text="'Total: $' + ${totalPrice}">Total: $0.00</div>
    </section>

    <div class="cart-page-actions">
        <a class="btn" href="/products">Continue Shopping</a>
        <a class="btn checkout-link" href="/checkout">Proceed to Checkout</a>
    </div>
</main>
<script src="/js/cart.js"></script>
</body>
</html>
