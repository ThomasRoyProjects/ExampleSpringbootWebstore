<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<header class="site-header">
    <a class="logo-container" th:href="@{/products}" aria-label="Skincare store home">
        <img class="logo" th:src="@{/images/skincarelogo.png}" alt="Skincare store logo">
    </a>
    <button id="cartButton" class="cart-btn" type="button" aria-controls="cartSidebar" aria-expanded="false">Cart</button>
</header>

<nav class="nav-bar" aria-label="Account">
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn">Logout</button>
    </form>
</nav>

<main>
    <h1 class="title-pages">Our Products</h1>

    <div class="product-grid">
        <article th:each="product : ${products}" class="product-card">
            <div class="product-image">
                <img th:src="@{${product.imageUrl}}" th:alt="${product.name + ' product image'}" />
            </div>
            <div class="product-info">
                <h2 th:text="${product.name}">Product Name</h2>
                <p th:text="${product.description}">Product Description</p>
                <p class="price">
                    Price: <span th:text="' $' + ${product.price}">$0.00</span>
                </p>
                <p class="stock">
                    Stock: <span th:text="${product.stockQuantity > 0 ? product.stockQuantity : 'Out of Stock'}">Out of Stock</span>
                </p>
                <button class="add-to-cart"
                        type="button"
                        th:attr="data-id=${product.productId},data-out-of-stock=${product.stockQuantity <= 0},aria-label=${product.stockQuantity > 0 ? 'Add ' + product.name + ' to cart' : product.name + ' is out of stock'}"
                        th:disabled="${product.stockQuantity <= 0}"
                        th:text="${product.stockQuantity > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</button>
            </div>
        </article>
    </div>
</main>

<aside id="cartSidebar" class="cart-sidebar" aria-labelledby="cartTitle" aria-hidden="true">
    <div class="cart-header">
        <h2 id="cartTitle">Your Cart</h2>
        <button id="closeCart" type="button" aria-label="Close cart">Close</button>
    </div>
    <div id="cartStatus" class="cart-status" role="status" aria-live="polite"></div>
    <div id="cartItems" class="cart-items" th:replace="~{cart :: cart-items}"></div>
    <div class="cart-footer">
        <p>Total: <strong id="cartFooterTotal" th:text="'$' + ${totalPrice}">$0.00</strong></p>
        <button id="clearCart" type="button">Clear Cart</button>
        <a class="btn checkout-link" th:href="@{/checkout}">Proceed to Checkout</a>
    </div>
</aside>

<script src="/js/cart.js"></script>
</body>
</html>
