<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body>
    <main class="admin-auth-container">
        <div class="admin-auth-card">
            <p class="eyebrow">Administrator access</p>
            <h1>Admin Login</h1>
            <p class="auth-support">Use your administrator email address to manage the catalog and inventory.</p>
            <form th:action="@{/admin/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-field">
                    <label for="admin-email">Email</label>
                    <input id="admin-email" type="email" name="email" autocomplete="email" inputmode="email" required aria-describedby="admin-login-error">
                </div>
                <div class="form-field">
                    <label for="admin-password">Password</label>
                    <input id="admin-password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <p id="admin-login-error" class="field-error" th:if="${param.error}" role="alert">We couldn't sign you in with that admin email and password.</p>
                <button class="auth-primary" type="submit">Login</button>
            </form>
        </div>
    </main>
</body>
</html>
